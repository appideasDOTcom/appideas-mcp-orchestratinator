<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orchestratinator</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="live-dot" class="dot" title="connection to the server"></span>
      <h1>orchestratinator</h1>
      <span id="version" class="muted mono"></span>
    </div>
    <div class="topbar-meta muted mono" id="server-meta"></div>
    <div class="topbar-actions">
      <!--
        Two views of one server. The board is the original and stays exactly as
        it was; the floor is for the people who operate this without having
        built it. The choice is remembered per browser, like minimising a
        channel is — a view preference, not a statement about the work.
      -->
      <div class="chips" id="view-switch">
        <button class="chip on" data-view="board" title="The board — channels, agents, tasks">board</button>
        <button class="chip" data-view="floor" title="The floor — one room per channel, one desk per agent">floor</button>
      </div>
      <span id="admin-state" class="admin-locked mono hidden"></span>
      <label class="switch">
        <input type="checkbox" id="autorefresh" checked>
        <span>auto-refresh</span>
      </label>
      <button id="refresh-now" class="btn" title="Refresh now">↻</button>
      <button id="open-settings" class="btn" title="Settings — export and restore">⚙</button>
    </div>
  </header>

  <main>
    <!--
      The floor. Sits alongside the board rather than replacing it: the board is
      working well and nothing here is allowed to regress it. `body.view-floor`
      decides which of the two is on screen.
    -->
    <section class="panel panel-floor" id="floor">
      <div class="panel-head">
        <h2>Needs you</h2>
        <div id="floor-totals" class="muted mono"></div>
      </div>
      <div id="floor-queue" class="queue"></div>
      <div class="chips" id="floor-pick"></div>
      <div class="floor-body">
        <div id="floor-rooms" class="rooms"></div>
        <aside id="floor-panel" class="deskpanel hidden"></aside>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Channels &amp; agents</h2>
        <div id="totals" class="muted mono"></div>
      </div>
      <div id="channels" class="channel-grid"></div>
    </section>

    <section class="panel panel-log">
      <div class="panel-head">
        <h2>Activity log</h2>
        <div class="log-controls">
          <select id="filter-channel" class="input" title="Filter by channel">
            <option value="">all channels</option>
          </select>
          <div class="chips" id="filter-kinds">
            <button class="chip on" data-kind="message">messages</button>
            <button class="chip on" data-kind="task">tasks</button>
            <button class="chip on" data-kind="contract">contracts</button>
            <button class="chip on" data-kind="admin">operator</button>
          </div>
          <input id="filter-text" class="input" type="search" placeholder="search…" autocomplete="off">
          <span id="log-count" class="muted mono"></span>
        </div>
      </div>
      <div class="log-scroll" id="log-scroll">
        <table class="log">
          <thead>
            <tr><th class="c-when">when</th><th class="c-chan">channel</th><th class="c-kind">event</th><th class="c-who">who</th><th class="c-what">what</th></tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
        <div class="log-foot">
          <button id="load-more" class="btn">load more</button>
        </div>
      </div>
    </section>
  </main>

  <!--
    Operator dialogs live here, on <body>, and not inside #channels: that grid is
    replaced wholesale on every data change, which would tear an open dialog out
    from under the pointer mid-click.
  -->
  <dialog id="dlg" class="dlg">
    <div id="dlg-body"></div>
  </dialog>

  <!--
    Settings gets a dialog of its own rather than sharing the operator one. It is
    wider, it holds in-progress state (a chosen backup file awaiting a typed
    confirmation), and the operator helper closes its dialog and re-renders the
    board after every action — which would throw that state away mid-flow.
  -->
  <dialog id="settings-dlg" class="dlg dlg-wide">
    <div class="set-head">
      <h3>Export &amp; restore</h3>
      <button type="button" class="btn" data-set="close" title="Close">✕</button>
    </div>
    <div id="set-body"></div>
  </dialog>

  <script src="./app.js"></script>
  <script src="./floor.js"></script>
</body>
</html>
