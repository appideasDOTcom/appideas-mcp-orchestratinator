services:
  orchestratinator:
    build: .
    container_name: appideas-orchestratinator
    restart: unless-stopped
    ports:
      # Published on the loopback interface only — there's no auth on either the
      # MCP endpoint or the dashboard. Drop the 127.0.0.1 prefix at your own risk.
      - "127.0.0.1:8787:8787"
    environment:
      - PORT=8787
      - DB_PATH=/data/orchestratinator.db
      - CLAIM_TTL_MINUTES=15
    volumes:
      - orchestratinator-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orchestratinator-data:
