services:
  orchestratinator:
    build: .
    container_name: appideas-orchestratinator
    restart: unless-stopped
    ports:
      # Published on every interface, so other machines on your network can reach
      # the board and their agents can reach /mcp. Read that as what it is: the
      # dashboard has no sign-in, so anything that can route to this host can read
      # the board and take operator actions on it. That is the intended model for
      # one machine on one trusted network behind a firewall, and nothing else.
      # Put back the "127.0.0.1:" prefix to make it this machine only.
      - "8787:8787"
    environment:
      # Shared secret MCP clients present as X-Orchestratinator-Key. Substituted
      # from ./.env, which is gitignored; compose fails loudly rather than
      # quietly starting an unlocked server if it's missing. This guards /mcp
      # only — the dashboard is open.
      - ORCH_AUTH_TOKEN=${ORCH_AUTH_TOKEN:?set ORCH_AUTH_TOKEN in .env (see .env.example)}
      # off | warn | enforce — see .env.example. `warn` logs bad keys and lets
      # them through, which is how you roll this out without cutting off an
      # agent that's still on an old .mcp.json.
      - ORCH_AUTH_MODE=${ORCH_AUTH_MODE:-enforce}
      # Only affects the client address named in an auth warning. Under Docker with
      # nothing in front, every request arrives from the bridge gateway.
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      - PORT=8787
      - DB_PATH=/data/orchestratinator.db
      - CLAIM_TTL_MINUTES=15
      - SESSION_TTL_MINUTES=15
      - STATUS_TTL_SECONDS=900
    volumes:
      - orchestratinator-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orchestratinator-data:
